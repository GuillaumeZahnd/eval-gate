site_name: eval-gate
site_url: https://GuillaumeZahnd.github.io/eval-gate/
repo_url: https://github.com/GuillaumeZahnd/eval-gate

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            members_order: source

nav:
  - Home: index.md
  - API reference: reference.md
