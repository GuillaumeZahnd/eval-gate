[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eval-gate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "scipy>=1.14",    
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]
